
buildscript {
    repositories {
        mavenCentral()
        maven {
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = 'net.coms.abilitysgorwmod'

base {
    archivesName = 'abilitysgorwmod'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

processResources {
    inputs.property 'mod_version', project.version
    filesMatching('META-INF/mods.toml') {
        expand 'mod_version': project.version
    }
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')

            mods {
                abilitysgorwmod {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')

            mods {
                abilitysgorwmod {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')

            mods {
                abilitysgorwmod {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, 'abilitysgorwmod.refmap.json'
    config 'abilitysgorwmod.mixins.json'
}

repositories {
    mavenCentral()
    maven {
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

jar {
    manifest {
        attributes([
                'Specification-Title': 'AbilitysgorwMOD',
                'Specification-Vendor': 'TeramodGuard',
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'TeramodGuard',
                'MixinConfigs': 'abilitysgorwmod.mixins.json'
        ])
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }

    repositories {
        mavenLocal()
    }
}
